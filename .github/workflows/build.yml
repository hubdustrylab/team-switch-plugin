name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mindustry: [v160, v160.7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: bash ./gradlew build -PmindustryVersion=${{ matrix.mindustry }}
      - run: bash ./gradlew -p examples/embedded build -PmindustryVersion=${{ matrix.mindustry }}
      - name: Start each plugin on a clean server
        env:
          MINDUSTRY_VERSION: ${{ matrix.mindustry }}
        run: |
          set -euo pipefail
          smoke=$(mktemp -d)
          engine="$GITHUB_WORKSPACE/build/dependencies/mindustry-$MINDUSTRY_VERSION.jar"
          mkdir -p "$smoke/standalone/config/mods" "$smoke/embedded/config/mods"
          cp build/libs/team-switch-*.jar "$smoke/standalone/config/mods/"
          cp examples/embedded/build/libs/server-with-team-switch.jar "$smoke/embedded/config/mods/"
          (
            cd "$smoke/standalone"
            timeout 30s java -jar "$engine" 'exit'
          ) | tee "$smoke/standalone.log"
          grep -Fq 'Team Switch uses ' "$smoke/standalone.log"
          test -f "$smoke/standalone/config/mods/team-switch/config.properties"
          (
            cd "$smoke/embedded"
            timeout 30s java -jar "$engine" 'example-status,exit'
          ) | tee "$smoke/embedded.log"
          grep -Fq 'The example plugin is active.' "$smoke/embedded.log"
          test -f "$smoke/embedded/config/mods/server-with-team-switch/team-switch/config.properties"
